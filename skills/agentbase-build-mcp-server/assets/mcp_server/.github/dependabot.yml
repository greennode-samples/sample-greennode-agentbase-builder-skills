# Weekly pull requests for what this server runs: python packages (uv.lock), the python / uv base
# images of the Dockerfile (pinned by digest) and the GitHub Actions of the workflow. Review and merge them.
# Server inside another repository: set `directory` to the server's directory (the Actions entry stays "/").
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
