# __PROJECT_NAME__ — Dependabot: weekly pull requests for what this project runs. Review and merge them; run
# `make test` and `make security-scan` on each (CI does). Turn on Dependabot alerts too (repository Settings →
# Advanced Security) — alerts report known vulnerabilities, these updates fix them. This file is yours: change the
# schedule, add reviewers, ignore a package. /agentbase-build-scaffold explains what is pinned and why.
version: 2
updates:
  # src/backend/uv.lock — minor and patch updates in one pull request; a major update is its own and needs a look at
  # pyproject.toml's upper bound (the template's code relies on SDK internals — read the package's changelog first)
  - package-ecosystem: "uv"
    directory: "/src/backend"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
  # The python and uv images in src/backend/Dockerfile are pinned by digest: this is what moves them (security fixes
  # of the OS and Python reach the image only this way)
  - package-ecosystem: "docker"
    directory: "/src/backend"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns: ["*"]
  # Actions in .github/workflows are pinned to commit SHAs (the release stays in a comment)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
